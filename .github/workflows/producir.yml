# Producción de Shorts de Línea Punteada en la nube, POR FRAGMENTOS (docs/OPERACION.md § "Producción en la nube").
# Un video por run. Toma un guion YA ESCRITO del backlog, y lo produce en tres etapas:
#   preparar  (1 job)  : voz Edge TTS, satélite NASA GIBS/Sentinel-2, Natural Earth, fotos de Commons (todo sin credenciales),
#                        props y duración; deja todo en un artifact interno.
#   fragmento (N jobs) : cada uno renderiza (en paralelo) un tramo de frames sin audio, en su propio runner de 4 vCPU.
#   final     (1 job)  : une los tramos, renderiza el audio completo, los mezcla, deja el json de bandeja, la hoja de contacto
#                        y publica el artifact "shorts-<fecha>-<run>" (mp4 + json + hoja + guion, 14 días).
# `fragmentos` = 1 equivale al render en un solo runner (más lento). Subida a YouTube: APAGADA (gancho reservado).
# Disparadores automáticos (schedule y push) APAGADOS salvo que la variable de repo LINEA_NUBE_AUTO valga 1:
# mientras el cron local de las 04:45 siga activo, ambos tomarían el mismo guion del backlog. A mano siempre funciona.
name: Producir Shorts

on:
  push:
    branches: [main]
    # Solo lo que produce un humano/sesión (guiones nuevos o cambios de calendario). NUNCA salida/:
    # así el commit del bot no podría disparar este workflow aunque se pusheara con otro token.
    paths:
      - 'contenido/backlog/**'
      - 'contenido/calendario.json'
  workflow_dispatch:
    inputs:
      guion:
        description: 'Opcional: texto contenido en el nombre/id de un guion del backlog'
        default: ''
        type: string
      fragmentos:
        description: 'En cuántos runners paralelos se reparte el render (1 = uno solo; 6 por defecto; máx. 16)'
        default: '6'
        type: string
      commit:
        description: 'Commitear el estado (guion movido, json de bandeja, hoja) como bot. A mano por defecto NO: solo artifact. Schedule/push siempre commitean'
        default: false
        type: boolean
      subir:
        description: 'Subir a YouTube (gancho reservado: hoy NO sube, solo avisa)'
        default: false
        type: boolean
  schedule:
    - cron: '45 7 * * *' # 07:45 UTC = 04:45 en Chile (horario de verano, UTC-3). Respaldo diario.

permissions:
  contents: write

# A mano: cada run es independiente (se pueden lanzar varios videos a la vez, cada uno con su guion).
# Automático: una producción a la vez (comparten el backlog y el commit del bot).
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('producir-{0}', github.run_id) || 'producir' }}
  cancel-in-progress: false

env:
  LINEA_NUBE: '1'
  LINEA_MEMORIA_MIN_MB: '1500'
  LINEA_RENDER_MAX_MIN: '150'
  GUION: ${{ inputs.guion || '' }}

jobs:
  preparar:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.LINEA_NUBE_AUTO == '1' &&
       (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'bot:')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      id: ${{ steps.datos.outputs.id }}
      composicion: ${{ steps.datos.outputs.composicion }}
      glflag: ${{ steps.datos.outputs.glflag }}
      frames: ${{ steps.datos.outputs.frames }}
      origen: ${{ steps.datos.outputs.origen }}
      indices: ${{ steps.datos.outputs.indices }}
      fragmentos: ${{ steps.datos.outputs.fragmentos }}
      fecha: ${{ steps.datos.outputs.fecha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # siempre el último estado de main (aunque lo dispare un push anterior); a mano se puede lanzar con --ref <rama> para probar
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci --no-audit --no-fund

      # Chrome headless de Remotion (~100 MB): se baja una vez por versión de Remotion (package-lock).
      - name: Caché del Chrome de Remotion
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: chrome-remotion-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chrome headless de Remotion
        run: npx remotion browser ensure

      # Recortes satelitales (NASA GIBS / Sentinel-2) y fotos de Commons: caché por guion; ayuda al repetir un guion (reintentos).
      - name: Caché de mapas e imágenes
        uses: actions/cache@v4
        with:
          path: |
            public/mapas
            public/imagenes
          key: mapas-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mapas-${{ runner.os }}-

      - name: Preparar (promover el guion, voz, sonido, mapas, props)
        id: diario
        env:
          NUBE_FASE: preparar
        run: |
          ls contenido/backlog/*.json 2>/dev/null | sort > /tmp/antes.txt || true
          banderas=(--sin-generar --sin-subir --n 1)
          [ -n "$GUION" ] && banderas+=(--guion "$GUION")
          set +e
          npx tsx scripts/diario.mts "${banderas[@]}"
          codigo=$?
          set -e
          exit $codigo

      - name: Datos del video y reparto en fragmentos
        id: datos
        run: |
          id=$(basename "$(ls -t salida/trabajo/*.props.json 2>/dev/null | head -1)" .props.json)
          [ -n "$id" ] && [ -f "contenido/guiones/$id.json" ] || { echo "::error::El guion pedido no produjo nada que renderizar (ver el log de 'Preparar')"; exit 1; }
          plantilla=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).plantilla)' "contenido/guiones/$id.json")
          comp="$(echo "${plantilla:0:1}" | tr a-z A-Z)${plantilla:1}"
          glflag=""; case "$plantilla" in ritmo|maquina) glflag="--gl=swangle" ;; esac
          npx remotion compositions src/index.ts --props="salida/trabajo/$id.props.json" $glflag > /tmp/comps.txt 2>&1 || true
          cat /tmp/comps.txt
          frames=$(awk -v c="$comp" '$1==c {print $4}' /tmp/comps.txt | head -1)
          [ -n "$frames" ] || { echo "::error::No pude leer la duración de la composición $comp"; exit 1; }
          n="${{ inputs.fragmentos || '6' }}"
          [ "$n" -ge 1 ] 2>/dev/null || n=6; [ "$n" -le 16 ] || n=16
          # nunca fragmentos de menos de 120 frames
          while [ "$n" -gt 1 ] && [ $(( frames / n )) -lt 120 ]; do n=$(( n - 1 )); done
          indices=$(seq -s, 0 $(( n - 1 )) | sed 's/^/[/; s/$/]/')
          ls contenido/backlog/*.json 2>/dev/null | sort > /tmp/despues.txt || true
          origen=$(comm -23 /tmp/antes.txt /tmp/despues.txt | head -1 || true)
          {
            echo "id=$id"; echo "composicion=$comp"; echo "glflag=$glflag"; echo "frames=$frames"
            echo "origen=$origen"; echo "indices=$indices"; echo "fragmentos=$n"
            echo "fecha=$(TZ=America/Santiago date +%F)"
          } >> "$GITHUB_OUTPUT"
          echo "Video $id · $comp · $frames frames · $n fragmento(s) · plantilla $plantilla"

      - name: Dejar lo preparado para los fragmentos
        uses: actions/upload-artifact@v4
        with:
          name: preparado
          path: |
            public/voz
            public/audio/generado
            public/mapas
            public/imagenes
            public/sim
            salida/trabajo
            contenido/guiones
          retention-days: 1
          if-no-files-found: ignore

  fragmento:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        i: ${{ fromJSON(needs.preparar.outputs.indices) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fuentes del sistema (emoji a color de los íconos)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-color-emoji > /dev/null
          fc-list | grep -qi "Noto Color Emoji" && echo "✓ Noto Color Emoji"

      - name: Dependencias
        run: npm ci --no-audit --no-fund

      - name: Caché del Chrome de Remotion
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: chrome-remotion-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chrome headless de Remotion
        run: npx remotion browser ensure

      - uses: actions/download-artifact@v4
        with:
          name: preparado
          path: .

      - name: Renderizar el fragmento ${{ matrix.i }} (sin audio)
        env:
          ID: ${{ needs.preparar.outputs.id }}
          COMP: ${{ needs.preparar.outputs.composicion }}
          GLFLAG: ${{ needs.preparar.outputs.glflag }}
          FRAMES: ${{ needs.preparar.outputs.frames }}
          N: ${{ needs.preparar.outputs.fragmentos }}
          I: ${{ matrix.i }}
        run: |
          a=$(( I * FRAMES / N )); b=$(( (I + 1) * FRAMES / N - 1 ))
          cpus=$(nproc); conc=$cpus; [ "$conc" -gt 4 ] && conc=4
          mkdir -p fragmentos
          out="fragmentos/frag-$(printf %03d "$I").mp4"
          echo "Fragmento $I/$N: frames $a-$b de $FRAMES · concurrency $conc · $COMP $GLFLAG"
          inicio=$(date +%s)
          npx remotion render src/index.ts "$COMP" "$out" --props="salida/trabajo/$ID.props.json" \
            --frames="$a-$b" --muted --codec=h264 --crf=18 --x264-preset=veryfast \
            --concurrency="$conc" --timeout=180000 --log=error $GLFLAG
          echo "⏱ fragmento $I: $(( $(date +%s) - inicio )) s"
          ls -la fragmentos

      - uses: actions/upload-artifact@v4
        with:
          name: frag-${{ matrix.i }}
          path: fragmentos/
          retention-days: 1
          compression-level: 0

  final:
    needs: [preparar, fragmento]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NUBE_ID: ${{ needs.preparar.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci --no-audit --no-fund

      - name: Caché del Chrome de Remotion
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: chrome-remotion-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chrome headless de Remotion
        run: npx remotion browser ensure

      - uses: actions/download-artifact@v4
        with:
          name: preparado
          path: .

      - uses: actions/download-artifact@v4
        with:
          pattern: frag-*
          path: fragmentos
          merge-multiple: true

      - name: Unir fragmentos, renderizar el audio y mezclar
        env:
          ID: ${{ needs.preparar.outputs.id }}
          COMP: ${{ needs.preparar.outputs.composicion }}
          GLFLAG: ${{ needs.preparar.outputs.glflag }}
        run: |
          set -e
          mkdir -p salida/bandeja
          ls -la fragmentos
          for f in $(ls fragmentos/frag-*.mp4 | sort); do echo "file '$PWD/$f'"; done > lista.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i lista.txt -c copy video-mudo.mp4
          inicio=$(date +%s)
          npx remotion render src/index.ts "$COMP" audio.aac --props="salida/trabajo/$ID.props.json" \
            --codec=aac --timeout=180000 --log=error $GLFLAG
          echo "⏱ audio: $(( $(date +%s) - inicio )) s"
          ffmpeg -hide_banner -loglevel error -y -i video-mudo.mp4 -i audio.aac -map 0:v:0 -map 1:a:0 -c copy -movflags +faststart "salida/bandeja/$ID.mp4"
          ls -la "salida/bandeja/$ID.mp4"

      - name: Registrar en la bandeja (json) y nombre del artifact
        id: fecha
        env:
          FECHA: ${{ needs.preparar.outputs.fecha }}
        run: |
          echo "fecha=$FECHA" >> "$GITHUB_OUTPUT"
          export LINEA_ARTEFACTO="\`shorts-$FECHA-${GITHUB_RUN_ID}\` del run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NUBE_FASE=final LINEA_PLANTILLAS_MANUALES=1 npx tsx scripts/diario.mts --sin-generar --sin-subir --solo-render

      - name: Hojas de contacto
        if: always()
        run: npx tsx scripts/hojas.mts

      - name: Reunir el resultado
        if: always()
        run: |
          mkdir -p resultado
          # mp4 + json de bandeja + hoja de contacto + guion promovido (la bandeja versionada no trae mp4).
          for mp4 in salida/bandeja/*.mp4; do
            [ -f "$mp4" ] || continue
            id=$(basename "$mp4" .mp4)
            cp "$mp4" resultado/
            for x in "salida/bandeja/$id.json" "salida/revisiones/hojas/$id.jpg" "contenido/guiones/$id.json"; do [ -f "$x" ] && cp "$x" resultado/ || true; done
          done
          ls -la resultado

      - name: Publicar resultado como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ steps.fecha.outputs.fecha }}-${{ github.run_id }}
          path: resultado/
          retention-days: 14
          compression-level: 0 # el mp4 ya viene comprimido
          if-no-files-found: warn

      - name: Commit del estado
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.commit)
        env:
          ORIGEN: ${{ needs.preparar.outputs.origen }}
        run: |
          # El guion consumido sale del backlog (en local lo hace promover).
          [ -n "$ORIGEN" ] && rm -f "$ORIGEN" || true
          .github/scripts/commit-bot.sh "bot: producción ${{ steps.fecha.outputs.fecha }}" \
            contenido/backlog contenido/guiones salida/bandeja salida/revisiones/hojas
